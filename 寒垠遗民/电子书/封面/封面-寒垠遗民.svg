<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2400" viewBox="0 0 1600 2400"
     role="img" aria-label="寒垠遗民 封面">
<title>寒垠遗民</title>
<desc>未来 · 星际难民 · 生态科幻 · 第一人称　作者 jwk000</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b0d11"/><stop offset=".24" stop-color="#14181e"/>
    <stop offset=".5" stop-color="#232931"/><stop offset=".78" stop-color="#39414b"/>
    <stop offset="1" stop-color="#4f5865"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b3545"/><stop offset=".14" stop-color="#0e2233"/>
    <stop offset=".42" stop-color="#071624"/><stop offset="1" stop-color="#02080e"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#82b9e1" stop-opacity=".2"/>
    <stop offset=".42" stop-color="#5a8cb9" stop-opacity=".07"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="hline" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#96b4cd" stop-opacity="0"/>
    <stop offset=".18" stop-color="#c4def3" stop-opacity=".72"/>
    <stop offset=".5" stop-color="#e4f3ff" stop-opacity=".95"/>
    <stop offset=".82" stop-color="#c4def3" stop-opacity=".72"/>
    <stop offset="1" stop-color="#96b4cd" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="vig" gradientUnits="userSpaceOnUse" cx="800" cy="1008" r="1"
      gradientTransform="translate(800 1008) scale(2400 2520)">
    <stop offset="0" stop-color="#000000" stop-opacity="0"/>
    <stop offset=".46" stop-color="#000000" stop-opacity=".06"/>
    <stop offset=".72" stop-color="#000000" stop-opacity=".28"/>
    <stop offset="1" stop-color="#000000" stop-opacity=".55"/>
  </radialGradient>
  <filter id="rainF" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="1620"
      color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.55 0.006" numOctaves="2" seed="9"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="grainF" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="2400"
      color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="1"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="hSoft" filterUnits="userSpaceOnUse" x="0" y="1500" width="1600" height="240">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
  <filter id="hWide" filterUnits="userSpaceOnUse" x="0" y="1400" width="1600" height="440">
    <feGaussianBlur stdDeviation="56"/>
  </filter>
  <filter id="titleShadow" filterUnits="userSpaceOnUse" x="180" y="300" width="1240" height="440"
      color-interpolation-filters="sRGB">
    <feDropShadow dx="0" dy="3" stdDeviation="14" flood-color="#000000" flood-opacity=".6"/>
  </filter>
</defs>
<rect width="1600" height="1620" fill="url(#sky)"/>
<rect y="1620" width="1600" height="780" fill="url(#sea)"/>
<rect y="1621" width="1600" height="460" fill="url(#glow)"/>
<rect width="1600" height="1620" filter="url(#rainF)" opacity=".05"/>
<rect y="1618" width="1600" height="2" fill="url(#hline)" filter="url(#hWide)" opacity=".55"/>
<rect y="1618" width="1600" height="2" fill="url(#hline)" filter="url(#hSoft)"/>
<rect y="1618" width="1600" height="2" fill="url(#hline)"/>
<rect width="1600" height="2400" fill="url(#vig)"/>
<g fill="#ced8e4" fill-opacity="0.44">
<text x="806.5" y="178.9" text-anchor="middle" font-family='"Noto Serif SC Light","Noto Serif SC","Source Han Serif SC",serif' font-size="25" font-weight="300" letter-spacing="13">未来 · 星际难民 · 生态科幻 · 第一人称</text>
</g>
<g fill="#f3f6f9" fill-opacity="1.0" filter="url(#titleShadow)">
<text x="819.6" y="594.7" text-anchor="middle" font-family='"Noto Serif SC Light","Noto Serif SC","Source Han Serif SC",serif' font-size="196" font-weight="300" letter-spacing="39.2">寒垠遗民</text>
</g>
<g fill="#eaf0f7" fill-opacity="0.82">
<text x="806.1" y="837.4" text-anchor="middle" font-family='"Noto Serif SC Light","Noto Serif SC","Source Han Serif SC",serif' font-size="41" font-weight="300" letter-spacing="12.3">jwk000</text>
</g>
<g fill="#d6e0ec" fill-opacity="0.58">
<text x="805" y="924.2" text-anchor="middle" font-family='"Noto Serif SC Light","Noto Serif SC","Source Han Serif SC",serif' font-size="33" font-weight="300" letter-spacing="9.9">又名《我从未见过海》</text>
</g>
<g fill="#bcccdc" fill-opacity="0.34">
<text x="802.3" y="1120.6" text-anchor="middle" font-family='"Noto Serif SC Light","Noto Serif SC","Source Han Serif SC",serif' font-size="29" font-weight="300" letter-spacing="4.6">蓝的，咸的，一直响的，</text>
<text x="802.3" y="1188.8" text-anchor="middle" font-family='"Noto Serif SC Light","Noto Serif SC","Source Han Serif SC",serif' font-size="29" font-weight="300" letter-spacing="4.6">一直响的，回头又回过头，</text>
<text x="802.3" y="1256.9" text-anchor="middle" font-family='"Noto Serif SC Light","Noto Serif SC","Source Han Serif SC",serif' font-size="29" font-weight="300" letter-spacing="4.6">我在岸上等你，你在岸上等我，</text>
<text x="802.3" y="1325.1" text-anchor="middle" font-family='"Noto Serif SC Light","Noto Serif SC","Source Han Serif SC",serif' font-size="29" font-weight="300" letter-spacing="4.6">我们谁也没到过岸上。</text>
</g>
<g fill="#98bcd8" fill-opacity="0.42">
<text x="806.8" y="2271.4" text-anchor="middle" font-family='"Noto Serif SC Light","Noto Serif SC","Source Han Serif SC",serif' font-size="22" font-weight="300" letter-spacing="13.6">灰星　KN-8813-e</text>
</g>
<rect width="1600" height="2400" filter="url(#grainF)" opacity=".055"/>
</svg>
